name: Validate Reliability Runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check runtime changes
        run: |
          node --check services/drvowa/baileysProvider.js
          node --check packages/baileys-v7-worker/src/worker.js
          node --check packages/baileys-v7-worker/src/saasDeliver.js
          node --check packages/baileys-v7-worker/src/mirrorSync.js
      - name: Durable capture crash/retry regression
        run: node --test tests/reliability-spool.node.test.cjs
      - name: Install Baileys v7 worker dependencies
        run: npm --prefix packages/baileys-v7-worker ci --ignore-scripts
      - name: History and media sync regression tests
        run: npm --prefix packages/baileys-v7-worker test
